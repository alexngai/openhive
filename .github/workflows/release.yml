name: Build/Release Electron App

# Triggered by pushing a tag like `v0.1.0`. Each run builds the Electron
# app on each target platform, packages it with electron-builder, and
# publishes the artifacts (DMG / AppImage / deb / latest-*.yml) to the
# GitHub Release matching the tag.
#
# Auto-update for installed apps is wired in main.ts via electron-updater,
# which reads `build.publish` from electron-app/package.json and polls
# this same GitHub Releases feed.
#
# Signing + notarization are NOT configured yet — the first releases will
# be unsigned, so macOS users must right-click → Open on first launch.
# Add the APPLE_* / CSC_* secrets and update electron-app/package.json's
# `mac.identity` when ready.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish artifacts to GitHub Releases'
        type: choice
        default: always
        options:
          - always   # create/update draft release with artifacts
          - never    # build + sign + notarize, no Release (artifacts stay as job artifacts for 90d)
          - onTag    # publish only if this run is triggered by a tag push

permissions:
  contents: write   # required for electron-builder to publish releases

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macos-arm64
          - os: ubuntu-latest
            label: linux-x64

    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        # Use `npm install` rather than `npm ci`: the lockfile is generated on
        # macOS and omits platform-specific optional dependencies for other
        # runners (notably @rollup/rollup-linux-x64-gnu), which breaks the
        # Linux build with "Cannot find module …" at tsup/rollup load time.
        # See https://github.com/npm/cli/issues/4828.
        run: npm install --no-audit --no-fund

      # Work around https://github.com/npm/cli/issues/4828 — even with
      # `npm install`, npm honors the darwin-generated lockfile's optional-dep
      # entries and skips the Linux rollup binary. Install it explicitly.
      - name: Install linux rollup binary
        if: runner.os == 'Linux'
        run: npm install --no-save --no-audit --no-fund @rollup/rollup-linux-x64-gnu

      - name: Build openhive (server + web)
        run: npm run build

      - name: Build electron-app TypeScript
        run: npm -w openhive-electron run build

      # Replace the workspace symlink at node_modules/openhive with a pruned
      # copy (dist/, bin/, package.json). Without this, electron-builder
      # follows the symlink to the repo root and bundles references/, .git/,
      # data/, prior release/ builds, etc. — ballooning the .dmg by several
      # GB. See electron-app/scripts/stage-openhive.mjs.
      - name: Stage openhive package
        working-directory: electron-app
        run: node scripts/stage-openhive.mjs

      - name: Package and publish
        working-directory: electron-app
        env:
          # GitHub Releases destination (the default workflow token is
          # enough because `permissions: contents: write` is set above).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # macOS signing + notarization. These are all optional — when
          # the repo secrets aren't set, the variables expand to empty
          # strings, electron-builder detects no cert, and produces
          # an unsigned build. Once you've set up an Apple Developer ID:
          #
          # 1. Add these 5 secrets at Settings → Secrets and variables → Actions:
          #      CSC_LINK                    base64 of the .p12 cert
          #      CSC_KEY_PASSWORD            the .p12 export password
          #      APPLE_ID                    your Apple developer email
          #      APPLE_APP_SPECIFIC_PASSWORD the notarization password from
          #                                  appleid.apple.com
          #      APPLE_TEAM_ID               10-char Team ID
          #
          # 2. In electron-app/package.json, flip `"identity": null` to
          #    `"identity": "Developer ID Application: Your Name (TEAMID)"`
          #    and `"notarize": false` to `"notarize": true`.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --publish ${{ github.event.inputs.publish || 'always' }}

      # Also attach the built installers as GitHub Action artifacts so they're
      # downloadable for 90d without needing a Release. Useful for
      # `workflow_dispatch` runs with publish=never.
      - name: Upload installers as job artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openhive-${{ matrix.label }}
          path: |
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest-*.yml
          if-no-files-found: warn
          retention-days: 90
