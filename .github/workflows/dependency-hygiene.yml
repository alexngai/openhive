name: Dependency Hygiene

# Catches the two recurring failure modes before they ship:
#   - syncpack: the same dependency pinned to different versions across our
#     own package.json files (root + electron-app + packages/*).
#   - publint: a publishable package whose package.json points at files that
#     won't be in the npm tarball (bad exports / main / files) — the empty
#     "openteams-editor" publish was exactly this class of bug.
#
# Note: references/ is a local-only convenience and is not part of the repo,
# so neither job checks out submodules — syncpack lints the workspaces only.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  syncpack:
    name: syncpack (version mismatches)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # npm bug #4828: the macOS-generated lockfile pins zero copies of some
      # linux optional deps. Same workaround as the other workflows.
      - name: Remove lockfile (npm bug #4828)
        run: rm -f package-lock.json

      - name: Install deps
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: Check for version mismatches
        run: npx syncpack lint

  publint:
    name: publint (publish validity)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Remove lockfile (npm bug #4828)
        run: rm -f package-lock.json

      - name: Install deps
        run: npm install --no-audit --no-fund --ignore-scripts

      # publint inspects the *built* package — exports/main/types must point
      # at files that exist, so dist/ has to be present first. The root build
      # produces openhive's dist/; openhive-headless has its own build step
      # that consumes the root's server bundle.
      - name: Build openhive
        run: npm run build

      - name: Build openhive-headless
        run: npm -w openhive-headless run build

      - name: Lint openhive
        run: npx publint

      - name: Lint openhive-headless
        run: npx publint packages/openhive-headless
